services:
  - type: web
    name: sx-content-app
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python scripts/build_base_pdf.py || true"
    startCommand: "gunicorn server:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60"
    envVars:
      - key: SX_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.11.9"
